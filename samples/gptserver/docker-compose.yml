version: '3.0'
services:
  websocket-gpt:
    build: .
    image: botium/websocket-gpt-sample
    environment:
      - OPENAI_API_KEY
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - OPENAI_SYSTEM_PROMPT=${OPENAI_SYSTEM_PROMPT:-You are a helpful assistant.}
    ports:
      - 4055:2345
      - 4056:2346
